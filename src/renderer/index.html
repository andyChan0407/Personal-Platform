<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>今日毕</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🍅</span>
        <span class="brand-text">
          <span class="brand-name">今日毕</span>
          <span class="brand-sub">专注每一天</span>
        </span>
      </div>

      <nav class="nav">
        <span class="nav-label">功能</span>
        <div class="nav-item active" data-view="todo">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h13M4 12h13M4 18h8"/><path d="M17.5 15.5l1.6 1.6 2.9-3.2"/></svg></span>
          <span>待办清单</span>
          <span class="nav-badge hidden" id="nav-todo-badge">0</span>
        </div>
        <div class="nav-item" data-view="pomodoro">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="7"/><path d="M12 13l3.2 3.2"/><path d="M9.5 3.5h5"/></svg></span>
          <span>番茄计时</span>
        </div>
        <div class="nav-item" data-view="stopwatch">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5V13.5l2.6 2"/><path d="M9 2.8h6"/><path d="M19 4.5l1.4 1.4"/></svg></span>
          <span>计时器</span>
        </div>
        <div class="nav-item" data-view="calendar">
          <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 9.8h17"/><path d="M8 3v4M16 3v4"/><path d="M8 14h2.5"/></svg></span>
          <span>日历</span>
        </div>
      </nav>

      <div class="sidebar-foot">
        <div id="status-bar" class="status-bar hidden"></div>
        <div class="tip-card">关闭窗口会退回<b>桌面胶囊</b>，数据自动保存在本机。</div>
      </div>
    </aside>

    <main class="main">
      <div class="main-inner">
        <div class="topbar">
          <div class="theme-switch" id="theme-switch" role="radiogroup" aria-label="主题"></div>
        </div>
        <div class="page-shell">
          <section id="view-todo" class="view"></section>
          <section id="view-pomodoro" class="view hidden"></section>
          <section id="view-stopwatch" class="view hidden"></section>
          <section id="view-calendar" class="view hidden"></section>
        </div>
      </div>
    </main>
  </div>

  <!-- 弹窗容器 -->
  <div id="modal-root"></div>

  <!-- 纯逻辑模块（Node/浏览器双端导出，此处走 window 全局） -->
  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/bus.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/pomodoro.js"></script>
  <script src="js/stopwatch.js"></script>
  <!-- 组装 window.api（逻辑模块 + preload 的 electronAPI） -->
  <script src="js/api-bridge.js"></script>
  <!-- 应用控制器与各视图 -->
  <script src="js/app.js"></script>
  <script src="js/ui-todo.js"></script>
  <script src="js/ui-pomodoro.js"></script>
  <script src="js/ui-stopwatch.js"></script>
  <script src="js/ui-calendar.js"></script>
</body>
</html>
